<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 2 — Charlie / Lumino</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:opsz,wght@14..32,400;14..32,700&display=swap');

:root {
  --midnight-ink: #000000;
  --paper-white: #ffffff;
  --concrete-gray: #838383;
  --alert-red: #ff0000;
  --radius-full: 100px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  background: var(--midnight-ink);
  color: var(--paper-white);
  height: 100vh; overflow: hidden;
  font-size: 19px; line-height: 1.32;
}

/* ─── Nav Pill buttons ─── */
.tab-nav {
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 7px;
}
.tab-nav button {
  font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 400;
  padding: 7px 20px; border-radius: var(--radius-full);
  border: 2px solid var(--paper-white); background: transparent;
  color: var(--paper-white); cursor: pointer;
  transition: all 0.18s ease;
}
.tab-nav button.active {
  background: var(--paper-white); color: var(--midnight-ink); border-color: var(--paper-white);
}

/* ─── View switching ─── */
.view { display: none; height: 100vh; overflow-y: auto; }
.view.active { display: flex; }

/* ═══════════ CHAT VIEW ═══════════ */
.chat-view { flex-direction: row; }

.chat-sidebar {
  width: 240px; border-right: 2px solid var(--concrete-gray);
  padding: 127px 30px 30px; display: flex; flex-direction: column; gap: 20px;
}
.chat-sidebar h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 40px;
  letter-spacing: -0.02em; color: var(--paper-white); margin-bottom: 10px;
}
.chat-sidebar .session {
  font-size: 19px; color: var(--concrete-gray); cursor: pointer;
  padding: 7px 15px; border-radius: var(--radius-full);
  transition: all 0.18s ease;
}
.chat-sidebar .session:hover { color: var(--paper-white); }
.chat-sidebar .session.active {
  background: var(--paper-white); color: var(--midnight-ink); font-weight: 700;
}
.new-chat-btn {
  align-self: flex-start; font-family: 'Inter', sans-serif;
  font-size: 19px; font-weight: 400; padding: 7px 20px;
  border-radius: var(--radius-full); border: 2px solid var(--paper-white);
  background: transparent; color: var(--paper-white); cursor: pointer;
  transition: all 0.18s ease;
}
.new-chat-btn:hover { background: var(--paper-white); color: var(--midnight-ink); }

.chat-main {
  flex: 1; display: flex; flex-direction: column;
  max-width: 1306px; margin: 0 auto;
}

/* Hero banner for active conversation */
.chat-hero {
  background: var(--alert-red); padding: 50px 30px;
  font-family: 'Bebas Neue', sans-serif; font-size: 145px; line-height: 0.7;
  letter-spacing: -0.02em; color: var(--midnight-ink);
  text-transform: uppercase;
}

.chat-messages {
  flex: 1; overflow-y: auto; padding: 30px;
  display: flex; flex-direction: column; gap: 20px;
}

.chat-msg {
  display: flex; gap: 16px; max-width: 800px; align-items: flex-start;
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700;
}
.msg-avatar.user-av { background: var(--paper-white); color: var(--midnight-ink); }
.msg-avatar.assistant-av {
  background: transparent; border: 2px solid var(--concrete-gray); color: var(--paper-white);
}
.msg-bubble {
  padding: 16px 20px; border-radius: 16px; font-size: 19px; line-height: 1.32;
}
.msg-bubble.user-bub { background: var(--paper-white); color: var(--midnight-ink); }
.msg-bubble.assistant-bub {
  border: 2px solid var(--concrete-gray); color: var(--paper-white);
}

.chat-input-container { padding: 20px 30px 30px; }
.chat-input-row {
  display: flex; gap: 15px; align-items: center;
  border: 2px solid var(--paper-white); border-radius: var(--radius-full);
  padding: 12px 12px 12px 30px;
}
.chat-input-row input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--paper-white); font-family: inherit; font-size: 19px;
}
.chat-input-row input::placeholder { color: var(--concrete-gray); }
.chat-input-row .send-btn {
  width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--paper-white);
  background: transparent; color: var(--paper-white); cursor: pointer;
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  transition: all 0.18s ease;
}
.chat-input-row .send-btn:hover { background: var(--paper-white); color: var(--midnight-ink); }

/* ═══════════ CONFIG VIEW ═══════════ */
.config-view {
  justify-content: center; align-items: flex-start;
  padding: 150px 50px 50px;
  gap: 59px; flex-direction: column; align-items: center;
}

.config-hero {
  width: 100%; max-width: 1306px; background: var(--alert-red);
  padding: 50px 30px; text-align: center;
}
.config-hero h1 {
  font-family: 'Bebas Neue', sans-serif; font-size: 145px; line-height: 0.7;
  letter-spacing: -0.02em; color: var(--midnight-ink); text-transform: uppercase;
}
.config-hero p {
  font-size: 19px; color: var(--midnight-ink); font-weight: 400; margin-top: 10px;
}

.config-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 30px; width: 100%; max-width: 1306px;
}
.config-card {
  border: 2px solid var(--concrete-gray);
  padding: 30px; border-radius: 0;
}
.config-card h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: -0.02em;
  margin-bottom: 20px;
}
.config-field { margin-bottom: 20px; }
.config-field label {
  font-size: 19px; color: var(--concrete-gray); display: block; margin-bottom: 7px;
}
.config-field input {
  width: 100%; padding: 15px 20px; border: 2px solid var(--concrete-gray);
  background: transparent; color: var(--paper-white); font-family: inherit;
  font-size: 19px; outline: none; transition: border-color 0.18s ease;
}
.config-field input:focus { border-color: var(--paper-white); }
.config-field input::placeholder { color: var(--concrete-gray); }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--concrete-gray);
}
.toggle-row span { font-size: 19px; }
.toggle {
  width: 52px; height: 28px; border-radius: var(--radius-full);
  border: 2px solid var(--concrete-gray); cursor: pointer; position: relative;
  transition: all 0.18s ease;
}
.toggle.on { border-color: var(--paper-white); background: var(--paper-white); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--concrete-gray); transition: all 0.18s ease;
}
.toggle.on::after { background: var(--midnight-ink); transform: translateX(24px); }

.save-btn {
  font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 400;
  padding: 7px 20px; border-radius: var(--radius-full);
  border: 2px solid var(--paper-white); background: var(--paper-white);
  color: var(--midnight-ink); cursor: pointer; margin-top: 30px;
  transition: all 0.18s ease;
}
.save-btn:hover { background: transparent; color: var(--paper-white); }

@media (max-width: 768px) {
  .chat-sidebar { display: none; }
  .chat-hero { font-size: 80px; padding: 30px 15px; }
  .config-grid { grid-template-columns: 1fr; }
  .config-hero h1 { font-size: 80px; }
}
</style>
</head>
<body>

<nav class="tab-nav">
  <button class="active" onclick="switchView('chat')">对话</button>
  <button onclick="switchView('config')">配置</button>
</nav>

<!-- ─── Chat View ─── -->
<div id="chat-view" class="view chat-view active">
  <aside class="chat-sidebar">
    <h2>THREADS</h2>
    <button class="new-chat-btn">+ NEW</button>
    <div class="session active">今日阅读总结</div>
    <div class="session">产品原型评审</div>
    <div class="session">API 集成</div>
    <div class="session">笔记整理</div>
  </aside>

  <div class="chat-main">
    <div class="chat-hero">ASSISTANT</div>
    <div class="chat-messages">
      <div class="chat-msg assistant">
        <div class="msg-avatar assistant-av">L</div>
        <div class="msg-bubble assistant-bub">
          我是 Lumino。读取页面、文件管理、记忆检索——你需要哪一项？
        </div>
      </div>
      <div class="chat-msg user">
        <div class="msg-bubble user-bub">帮我找一下上周关于 Obsidian 配置的笔记</div>
        <div class="msg-avatar user-av">U</div>
      </div>
      <div class="chat-msg assistant">
        <div class="msg-avatar assistant-av">L</div>
        <div class="msg-bubble assistant-bub">
          找到了。你在 5 月 9 日的日记忆里详细记录了 Obsidian Local REST API 的配置流程，
          包括 API Key 生成、插件安装和首次连接测试。需要我展开全文吗？
        </div>
      </div>
    </div>
    <div class="chat-input-container">
      <div class="chat-input-row">
        <input type="text" placeholder="输入指令…">
        <button class="send-btn">→</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── Config View ─── -->
<div id="config-view" class="view config-view">
  <div class="config-hero">
    <h1>CONFIG</h1>
    <p>模型连接 · 采集控制 · 集成设置</p>
  </div>

  <div class="config-grid">
    <div class="config-card">
      <h2>LLM</h2>
      <div class="config-field">
        <label>Base URL</label>
        <input type="text" value="https://api.openai.com/v1">
      </div>
      <div class="config-field">
        <label>API Key</label>
        <input type="password" value="sk-••••••••••••••••">
      </div>
      <div class="config-field">
        <label>Model</label>
        <input type="text" value="gpt-4o-mini">
      </div>
    </div>

    <div class="config-card">
      <h2>CONTROLS</h2>
      <div class="toggle-row">
        <span>页面采集</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="toggle-row">
        <span>输入记录</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="toggle-row">
        <span>剪贴板</span>
        <div class="toggle" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="toggle-row">
        <span>Obsidian</span>
        <div class="toggle" onclick="this.classList.toggle('on')"></div>
      </div>
      <button class="save-btn" onclick="alert('Saved.')">SAVE</button>
    </div>
  </div>
</div>

<script>
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name + '-view').classList.add('active');
  document.querySelectorAll('.tab-nav button').forEach((b, i) => {
    b.classList.toggle('active', (name === 'chat' && i === 0) || (name === 'config' && i === 1));
  });
}
</script>
</body>
</html>
