<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 3 — Fictional / Lumino</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

:root {
  --canvas-almond: #ffe9ce;
  --paper-white: #ffffff;
  --type-black: #000000;
  --grape-punch: #8a53ff;
  --bubblegum-red: #fd4b38;
  --sunshine-yellow: #ffd80c;
  --leafy-green: #3ccb09;
  --deep-indigo: #0500a3;
  --ash-gray: #666666;
  --light-gray: #dddddd;
  --radius-bubble: 144px;
  --radius-card: 15px;
  --radius-btn: 5px;
  --radius-circle: 100%;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Comic Neue', ui-rounded, sans-serif;
  background: var(--canvas-almond);
  color: var(--type-black);
  height: 100vh; overflow: hidden;
  font-size: 22px; line-height: 1.4;
  position: relative;
}

/* Decorative background elements */
body::before {
  content: ''; position: fixed; top: -80px; right: -40px;
  width: 200px; height: 200px; border-radius: var(--radius-circle);
  background: var(--bubblegum-red); opacity: 0.25; z-index: 0; pointer-events: none;
}
body::after {
  content: ''; position: fixed; bottom: -60px; left: -60px;
  width: 280px; height: 280px; border-radius: var(--radius-circle);
  background: var(--leafy-green); opacity: 0.2; z-index: 0; pointer-events: none;
}

/* ─── Nav ─── */
.tab-nav {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 0; background: var(--paper-white);
  border-radius: var(--radius-bubble); padding: 6px 12px;
  box-shadow: var(--sunshine-yellow) 0px 0px 0px 2px;
}
.tab-nav button {
  font-family: 'Comic Neue', sans-serif; font-size: 22px; font-weight: 400;
  padding: 8px 24px; border-radius: var(--radius-bubble);
  border: none; background: transparent; cursor: pointer;
  color: var(--ash-gray); transition: all 0.18s ease;
}
.tab-nav button.active {
  background: var(--grape-punch); color: var(--paper-white);
}

/* ─── Views ─── */
.view { display: none; height: 100vh; overflow-y: auto; position: relative; z-index: 1; }
.view.active { display: flex; }

/* ═══════════ CHAT VIEW ═══════════ */
.chat-view { flex-direction: column; align-items: center; padding: 120px 30px 30px; }

.chat-header {
  text-align: center; margin-bottom: 30px;
}
.chat-header h1 {
  font-size: 48px; line-height: 1.2; margin-bottom: 10px;
  color: var(--type-black);
}
.chat-header .decorative-badge {
  display: inline-block; padding: 6px 18px; border-radius: var(--radius-card);
  background: var(--leafy-green); color: var(--paper-white); font-size: 16px;
  margin-bottom: 12px;
}

/* Session stripe (sticker style) */
.session-strip {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 30px;
}
.session-tag {
  padding: 8px 24px; border-radius: var(--radius-bubble);
  font-size: 16px; cursor: pointer; transition: all 0.18s ease;
  border: 2px solid transparent;
}
.session-tag:nth-child(1) { background: var(--grape-punch); color: var(--paper-white); }
.session-tag:nth-child(2) { background: var(--sunshine-yellow); }
.session-tag:nth-child(3) { background: var(--bubblegum-red); color: var(--paper-white); }
.session-tag:nth-child(4) { background: var(--leafy-green); color: var(--paper-white); }
.session-tag:hover { transform: rotate(-2deg) scale(1.05); }

.new-chat-btn {
  padding: 10px 30px; border-radius: var(--radius-btn);
  border: 2px solid var(--type-black); background: transparent;
  font-family: inherit; font-size: 22px; cursor: pointer;
  transition: all 0.18s ease; margin-bottom: 24px;
}
.new-chat-btn:hover { background: var(--type-black); color: var(--paper-white); }

/* Chat messages */
.chat-messages {
  width: 100%; max-width: 720px; flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 24px; margin-bottom: 24px;
}

.chat-msg { display: flex; gap: 12px; align-items: flex-start; max-width: 100%; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 48px; height: 48px; border-radius: var(--radius-circle);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; border: 3px solid var(--type-black);
}
.msg-avatar.user-av { background: var(--sunshine-yellow); }
.msg-avatar.assistant-av { background: var(--grape-punch); color: var(--paper-white); }

.msg-bubble {
  padding: 24px 28px; border-radius: var(--radius-bubble);
  font-size: 22px; line-height: 1.4; max-width: 550px;
}
.msg-bubble.user-bub { background: var(--sunshine-yellow); color: var(--type-black); }
.msg-bubble.assistant-bub { background: var(--paper-white); color: var(--type-black); }

.chat-input-row {
  width: 100%; max-width: 720px; display: flex; gap: 12px;
  background: var(--paper-white); border-radius: var(--radius-bubble);
  padding: 12px 12px 12px 28px;
  border: 2px solid var(--type-black);
}
.chat-input-row input {
  flex: 1; background: none; border: none; outline: none;
  font-family: inherit; font-size: 22px; color: var(--type-black);
}
.chat-input-row input::placeholder { color: var(--ash-gray); }
.chat-input-row button {
  width: 52px; height: 52px; border-radius: var(--radius-circle);
  border: 2px solid var(--type-black); background: var(--leafy-green);
  color: var(--paper-white); font-size: 24px; cursor: pointer;
  transition: all 0.18s ease; display: flex; align-items: center; justify-content: center;
}
.chat-input-row button:hover { background: var(--type-black); }

/* ═══════════ CONFIG VIEW ═══════════ */
.config-view {
  flex-direction: column; align-items: center; padding: 120px 30px 60px;
  position: relative;
}
.config-view::before {
  content: '✦'; position: absolute; top: 90px; right: 60px;
  font-size: 48px; color: var(--bubblegum-red); opacity: 0.4;
}

.config-card {
  width: 100%; max-width: 600px; background: var(--paper-white);
  border-radius: var(--radius-bubble); padding: 43px 48px;
  margin-bottom: 24px;
}
.config-card h1 {
  font-size: 48px; line-height: 1.2; margin-bottom: 10px;
}
.config-card .subtitle {
  font-size: 22px; color: var(--ash-gray); margin-bottom: 30px;
}

.config-field { margin-bottom: 24px; }
.config-field label {
  font-size: 16px; color: var(--ash-gray); display: block; margin-bottom: 6px;
  text-transform: uppercase;
}
.config-field input {
  width: 100%; padding: 16px 20px; border: 3px solid var(--type-black);
  border-radius: var(--radius-btn); background: var(--canvas-almond);
  font-family: inherit; font-size: 22px; outline: none;
  transition: border-color 0.18s ease;
}
.config-field input:focus { border-color: var(--grape-punch); }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; border-bottom: 2px dashed var(--light-gray);
}
.toggle-row span { font-size: 22px; }
.toggle {
  width: 56px; height: 32px; border-radius: var(--radius-bubble);
  background: var(--light-gray); cursor: pointer; position: relative;
  transition: background 0.18s ease; border: 2px solid var(--type-black);
}
.toggle.on { background: var(--grape-punch); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: var(--radius-circle);
  background: var(--paper-white); border: 2px solid var(--type-black);
  transition: transform 0.18s ease;
}
.toggle.on::after { transform: translateX(24px); }

.config-card .save-row { margin-top: 30px; display: flex; gap: 12px; align-items: center; }
.config-card .save-row button {
  padding: 12px 36px; border-radius: var(--radius-btn);
  border: 3px solid var(--type-black); background: var(--bubblegum-red);
  color: var(--paper-white); font-family: inherit; font-size: 22px;
  cursor: pointer; transition: all 0.18s ease;
}
.config-card .save-row button:hover { background: var(--type-black); }
.config-card .save-row .status { font-size: 16px; color: var(--ash-gray); }

/* Floating decorative stickers */
.sticker {
  position: fixed; z-index: 0; pointer-events: none;
  width: 60px; height: 60px; border-radius: var(--radius-circle);
}
.sticker-a { top: 20%; right: 8%; background: var(--bubblegum-red); opacity: 0.15; }
.sticker-b { bottom: 15%; left: 5%; background: var(--grape-punch); opacity: 0.12; }
.sticker-c { top: 60%; right: 12%; background: var(--sunshine-yellow); opacity: 0.18; }
</style>
</head>
<body>

<div class="sticker sticker-a"></div>
<div class="sticker sticker-b"></div>
<div class="sticker sticker-c"></div>

<nav class="tab-nav">
  <button class="active" onclick="switchView('chat')">对话</button>
  <button onclick="switchView('config')">配置</button>
</nav>

<!-- ─── Chat View ─── -->
<div id="chat-view" class="view chat-view active">
  <div class="chat-header">
    <span class="decorative-badge">✦ 陪伴型 AI</span>
    <h1>Lumino</h1>
  </div>

  <div class="session-strip">
    <div class="session-tag">今日阅读</div>
    <div class="session-tag">原型评审</div>
    <div class="session-tag">API 探讨</div>
    <div class="session-tag">笔记整理</div>
  </div>

  <button class="new-chat-btn">+ 开始新对话</button>

  <div class="chat-messages">
    <div class="chat-msg assistant">
      <div class="msg-avatar assistant-av">L</div>
      <div class="msg-bubble assistant-bub">
        嗨！我是 Lumino 🌟<br>可以帮你读网页、管理文件、搜索记忆。有什么需要？
      </div>
    </div>
    <div class="chat-msg user">
      <div class="msg-bubble user-bub">今天看了哪些有意思的文章？</div>
      <div class="msg-avatar user-av">U</div>
    </div>
    <div class="chat-msg assistant">
      <div class="msg-avatar assistant-av">L</div>
      <div class="msg-bubble assistant-bub">
        让我翻翻你的记忆小抽屉…<br><br>
        📎 <strong>架构决策记录</strong> — 微服务边界讨论<br>
        📎 <strong>Tailwind v4</strong> — 新 utility-first 语法<br>
        📎 <strong>OPFS Benchmark</strong> — 浏览器文件系统性能<br><br>
        想深入了解哪一篇呀？
      </div>
    </div>
  </div>

  <div class="chat-input-row">
    <input type="text" placeholder="说点什么有趣的事…">
    <button>→</button>
  </div>
</div>

<!-- ─── Config View ─── -->
<div id="config-view" class="view config-view">
  <div class="config-card">
    <h1>小书房配置</h1>
    <p class="subtitle">连上模型，控制采集——剩下的交给我们。</p>

    <div class="config-field">
      <label>Base URL</label>
      <input type="text" value="https://api.openai.com/v1">
    </div>
    <div class="config-field">
      <label>API Key</label>
      <input type="password" value="sk-••••••••••••••••">
    </div>
    <div class="config-field">
      <label>Model</label>
      <input type="text" value="gpt-4o-mini">
    </div>

    <div class="toggle-row">
      <span>页面内容采集</span>
      <div class="toggle on" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>输入事件记录</span>
      <div class="toggle on" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>剪贴板监听</span>
      <div class="toggle" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>Obsidian 集成</span>
      <div class="toggle" onclick="this.classList.toggle('on')"></div>
    </div>

    <div class="save-row">
      <button onclick="showSaved()">保存配置</button>
      <span class="status" id="fictional-status"></span>
    </div>
  </div>
</div>

<script>
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name + '-view').classList.add('active');
  document.querySelectorAll('.tab-nav button').forEach((b, i) => {
    b.classList.toggle('active', (name === 'chat' && i === 0) || (name === 'config' && i === 1));
  });
}
function showSaved() {
  const s = document.getElementById('fictional-status');
  s.textContent = '好啦，收进抽屉里了！✨';
  setTimeout(() => s.textContent = '', 2000);
}
</script>
</body>
</html>
