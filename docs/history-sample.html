<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史会话列表</title>
<style>
:root {
  --lumi-surface: #fdfbf7;
  --lumi-surface-solid: #f5f2eb;
  --lumi-bg: #f9f7f2;
  --lumi-text: #2d2622;
  --lumi-text-faint: #99938b;
  --lumi-text-soft: #706860;
  --lumi-text-primary: #1a1714;
  --lumi-border: #e8e3da;
  --lumi-border-strong: #d5cec3;
  --lumi-accent-a: #ae8ef0;
  --lumi-font: "Plus Jakarta Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--lumi-font);
  font-size: 14px;
  background: var(--lumi-bg);
  color: var(--lumi-text);
  padding: 40px;
}
.panel {
  width: 340px;
  margin: 0 auto;
  background: var(--lumi-surface);
  border: 1px solid var(--lumi-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--lumi-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title { font-size: 15px; font-weight: 600; }
.panel-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--lumi-text-faint); }
.panel-search { padding: 10px 16px; }
.panel-search input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--lumi-border-strong);
  border-radius: 8px; font-size: 13px; outline: none;
  background: var(--lumi-bg); color: var(--lumi-text);
}
.panel-list { padding: 0 16px 16px; overflow-y: auto; max-height: 500px; }

/* — history item — */
.lm-history-item {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 6px;
  border: 1px solid var(--lumi-border);
  transition: background-color 0.15s;
}
.lm-history-item:hover { background: var(--lumi-surface-solid); }

.lm-history-item-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  width: 40px;
}

.lm-history-item-agent {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--lumi-surface-solid);
  color: var(--lumi-text-soft);
}
.lm-history-item-agent svg { width: 18px; height: 18px; }

.lm-history-item-agent-label {
  font-size: 8px; font-weight: 600; text-align: center;
  line-height: 1.2; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; max-width: 40px;
  color: var(--lumi-text-faint);
}

.lm-history-item-body {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 4px;
}

.lm-history-item-header {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lm-history-item-title {
  flex: 1; min-width: 0;
  font-weight: 600; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--lumi-text-primary);
}

.lm-history-item-date { font-size: 11px; flex-shrink: 0; color: var(--lumi-text-faint); }

.lm-history-item-preview {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--lumi-text-faint);
}
.lm-history-item-preview > span {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.lm-history-item-delete {
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  padding: 2px; border-radius: 4px; flex-shrink: 0;
  opacity: 0; transition: opacity 0.15s; color: var(--lumi-text-faint);
}
.lm-history-item:hover .lm-history-item-delete { opacity: 1; }
.lm-history-item-delete:hover { color: #c03e3e; }

/* SVG icon helper */
.icon-box {
  display: flex; align-items: center; justify-content: center;
  background: var(--lumi-surface-solid);
  color: var(--lumi-text-soft);
  border-radius: 8px;
  width: 32px; height: 32px;
}
.icon-box svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-header">
    <h3 class="panel-title">历史会话 (4)</h3>
    <button class="panel-close">&times;</button>
  </div>
  <div class="panel-search">
    <input type="text" placeholder="搜索会话...">
  </div>
  <div class="panel-list">

    <div class="lm-history-item">
      <div class="lm-history-item-left">
        <div class="lm-history-item-agent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6M11 8v6"/>
          </svg>
        </div>
        <span class="lm-history-item-agent-label">深度调研</span>
      </div>
      <div class="lm-history-item-body">
        <div class="lm-history-item-header">
          <span class="lm-history-item-title">AI芯片发展趋势研究</span>
          <span class="lm-history-item-date">14:35</span>
        </div>
        <div class="lm-history-item-preview">
          <span>根据你的要求，我对当前AI芯片市场进行了深入调研，以下是几个关键发现...</span>
          <button class="lm-history-item-delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lm-history-item">
      <div class="lm-history-item-left">
        <div class="lm-history-item-agent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="10" r="2"/><path d="M3 16l5-5 3 3 4-4 6 6"/>
          </svg>
        </div>
        <span class="lm-history-item-agent-label">设计复刻</span>
      </div>
      <div class="lm-history-item-body">
        <div class="lm-history-item-header">
          <span class="lm-history-item-title">HeyGen首页分析</span>
          <span class="lm-history-item-date">昨天 16:20</span>
        </div>
        <div class="lm-history-item-preview">
          <span>提取了首页的完整DOM结构和CSS样式，关键色彩方案为渐变紫色+青色+绿色...</span>
          <button class="lm-history-item-delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lm-history-item">
      <div class="lm-history-item-left">
        <div class="lm-history-item-agent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </div>
        <span class="lm-history-item-agent-label">页面操控</span>
      </div>
      <div class="lm-history-item-body">
        <div class="lm-history-item-header">
          <span class="lm-history-item-title">自动填写注册表单</span>
          <span class="lm-history-item-date">07/15 10:12</span>
        </div>
        <div class="lm-history-item-preview">
          <span>帮我填充这个页面的注册表单，姓名张三，邮箱zhangsan@example.com...</span>
          <button class="lm-history-item-delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lm-history-item">
      <div class="lm-history-item-left">
        <div class="lm-history-item-agent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="lm-history-item-agent-label">通用</span>
      </div>
      <div class="lm-history-item-body">
        <div class="lm-history-item-header">
          <span class="lm-history-item-title">写一个Python脚本</span>
          <span class="lm-history-item-date">07/14 22:05</span>
        </div>
        <div class="lm-history-item-preview">
          <span>帮我写一个Python脚本用来批量处理Excel文件中的数据...</span>
          <button class="lm-history-item-delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
