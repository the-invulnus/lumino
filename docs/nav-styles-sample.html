<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边导航样式对比</title>
<style>
:root {
  --lumi-surface: rgba(255,253,249,0.94);
  --lumi-surface-solid: #fffaf5;
  --lumi-bg: #fbf8f3;
  --lumi-bg-deep: #f6f2eb;
  --lumi-text: #3a322c;
  --lumi-text-faint: #b3aaa0;
  --lumi-text-soft: #807468;
  --lumi-text-primary: #1f1a16;
  --lumi-border: #ece6dc;
  --lumi-border-strong: #ddd5c8;
  --lumi-accent: #7c5cf0;
  --lumi-font: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--lumi-font);
  background: var(--lumi-bg);
  color: var(--lumi-text);
  padding: 32px 24px;
  min-height: 100vh;
}
h1 { font-size: 18px; margin-bottom: 4px; color: var(--lumi-text-primary); }
.sub { font-size: 13px; color: var(--lumi-text-faint); margin-bottom: 28px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  max-width: 980px;
}
.col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.col h2 { font-size: 13px; font-weight: 600; color: var(--lumi-text-primary); }
.col p { font-size: 11px; color: var(--lumi-text-faint); text-align: center; line-height: 1.5; max-width: 180px; }

/* 通用 stage：模拟聊天主内容 + 右侧栏 */
.stage {
  display: flex;
  width: 220px;
  height: 360px;
  background: var(--lumi-surface);
  border: 1px solid var(--lumi-border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.main {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.main-line { height: 8px; border-radius: 4px; background: var(--lumi-bg-deep); }
.main-line:nth-child(1) { width: 60%; }
.main-line:nth-child(2) { width: 90%; }
.main-line:nth-child(3) { width: 75%; }

/* ============ A. Linear 纯图标+胶囊条 ============ */
.nav-a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  width: 48px;
  border-left: 1px solid var(--lumi-border);
  background: var(--lumi-surface-solid);
}
.nav-a .item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  color: var(--lumi-text-soft);
  cursor: pointer;
  transition: background 0.15s;
}
.nav-a .item:hover { background: var(--lumi-bg-deep); }
.nav-a .item.active {
  background: var(--lumi-bg-deep);
  color: var(--lumi-text-primary);
}
.nav-a .item.active::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 16px;
  border-radius: 0 3px 3px 0;
  background: var(--lumi-accent);
}
.nav-a .spacer { flex: 1; }
.nav-a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ============ B. VS Code 纯图标+Tooltip ============ */
.nav-b {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  width: 48px;
  border-left: 1px solid var(--lumi-border);
  background: var(--lumi-surface-solid);
}
.nav-b .item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  color: var(--lumi-text-soft);
  cursor: pointer;
  transition: background 0.15s;
}
.nav-b .item:hover { background: var(--lumi-bg-deep); color: var(--lumi-text-primary); }
.nav-b .item.active { color: var(--lumi-accent); }
.nav-b .item.active::after {
  content: "";
  position: absolute;
  bottom: 2px;
  width: 14px;
  height: 2px;
  border-radius: 2px;
  background: var(--lumi-accent);
}
.nav-b .tip {
  position: absolute;
  left: calc(100% + 8px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--lumi-text-primary);
  color: #fff;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 5;
}
.nav-b .item:hover .tip { opacity: 1; }
.nav-b .spacer { flex: 1; }
.nav-b svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ============ C. iOS 全宽高亮条 ============ */
.nav-c {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 6px;
  width: 72px;
  border-left: 1px solid var(--lumi-border);
  background: var(--lumi-surface-solid);
}
.nav-c .item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border-radius: 8px;
  color: var(--lumi-text-soft);
  cursor: pointer;
  transition: background 0.15s;
}
.nav-c .item:hover { background: var(--lumi-bg-deep); }
.nav-c .item.active { background: var(--lumi-bg-deep); color: var(--lumi-text-primary); }
.nav-c .lbl { font-size: 9px; font-weight: 600; }
.nav-c .spacer { flex: 1; }
.nav-c svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ============ D. macOS Dock 浮岛 ============ */
.nav-d {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px;
  margin: 8px 6px 8px 0;
  width: 50px;
  border: 1px solid var(--lumi-border);
  border-radius: 16px;
  background: var(--lumi-surface-solid);
  box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}
.nav-d .item {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  color: var(--lumi-text-soft);
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), background 0.15s;
}
.nav-d .item:hover { background: var(--lumi-bg-deep); transform: scale(1.15); }
.nav-d .item.active {
  background: linear-gradient(127deg, #f3a6ff 12%, #00c4ff 70%, #35c838 89%);
  color: #fff;
  transform: scale(1.12);
}
.nav-d .spacer { flex: 1; }
.nav-d svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
