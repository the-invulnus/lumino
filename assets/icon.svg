<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e2a63f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e2a63f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2a63f"/>
      <stop offset="100%" stop-color="#c48820"/>
    </radialGradient>
  </defs>

  <!-- background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#e2a63f" stroke-width="3"/>

  <!-- subtle glow behind cat -->
  <circle cx="256" cy="280" r="140" fill="url(#glow)"/>

  <g id="cat">
    <!-- body -->
    <ellipse cx="256" cy="310" rx="110" ry="120" fill="#1c1c24"/>

    <!-- ears -->
    <polygon points="175,150 210,200 140,210" fill="#1c1c24" stroke="#e2a63f" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="337,150 302,200 372,210" fill="#1c1c24" stroke="#e2a63f" stroke-width="2" stroke-linejoin="round"/>
    <!-- inner ears -->
    <polygon points="180,160 205,195 152,203" fill="#2e1a2e"/>
    <polygon points="332,160 307,195 360,203" fill="#2e1a2e"/>

    <!-- head -->
    <ellipse cx="256" cy="240" rx="90" ry="82" fill="#1c1c24"/>

    <!-- cheek fur -->
    <ellipse cx="195" cy="268" rx="28" ry="20" fill="#252530"/>
    <ellipse cx="317" cy="268" rx="28" ry="20" fill="#252530"/>

    <!-- eyes -->
    <g class="eyes">
      <!-- left eye -->
      <ellipse cx="228" cy="232" rx="22" ry="26" fill="#1a1a2e" stroke="#e2a63f" stroke-width="1.5"/>
      <ellipse cx="228" cy="230" rx="14" ry="18" fill="url(#eyeGlow)">
        <animate attributeName="ry" values="18;1;1;18" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;234;234;230" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- pupil slit -->
      <ellipse cx="228" cy="230" rx="3" ry="12" fill="#1c1c24">
        <animate attributeName="ry" values="12;0.5;0.5;12" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="224" cy="224" rx="4" ry="3" fill="rgba(255,255,255,0.35)"/>

      <!-- right eye -->
      <ellipse cx="284" cy="232" rx="22" ry="26" fill="#1a1a2e" stroke="#e2a63f" stroke-width="1.5"/>
      <ellipse cx="284" cy="230" rx="14" ry="18" fill="url(#eyeGlow)">
        <animate attributeName="ry" values="18;1;1;18" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;234;234;230" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- pupil slit -->
      <ellipse cx="284" cy="230" rx="3" ry="12" fill="#1c1c24">
        <animate attributeName="ry" values="12;0.5;0.5;12" keyTimes="0;0.05;0.1;0.15" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="280" cy="224" rx="4" ry="3" fill="rgba(255,255,255,0.35)"/>
    </g>

    <!-- nose -->
    <polygon points="256,260 250,268 262,268" fill="#e2a63f"/>
    <!-- mouth lines -->
    <path d="M244,274 Q256,282 256,274" fill="none" stroke="#e2a63f" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M268,274 Q256,282 256,274" fill="none" stroke="#e2a63f" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- whiskers -->
    <g stroke="#e2a63f" stroke-width="1" stroke-opacity="0.4" fill="none">
      <line x1="140" y1="248" x2="195" y2="258"/>
      <line x1="138" y1="264" x2="193" y2="264"/>
      <line x1="140" y1="280" x2="195" y2="270"/>
      <line x1="372" y1="248" x2="317" y2="258"/>
      <line x1="374" y1="264" x2="319" y2="264"/>
      <line x1="372" y1="280" x2="317" y2="270"/>
    </g>

    <!-- tail (animated) -->
    <g class="tail">
      <path d="M340,380 Q380,360 400,400 Q420,440 370,460 Q340,470 330,430" fill="none" stroke="#1c1c24" stroke-width="14" stroke-linecap="round"/>
      <path d="M340,380 Q380,360 400,400 Q420,440 370,460 Q340,470 330,430" fill="none" stroke="#e2a63f" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round">
        <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
          M340,380 Q380,360 400,400 Q420,440 370,460 Q340,470 330,430;
          M340,380 Q420,350 440,390 Q460,430 390,440 Q340,450 330,430;
          M340,380 Q380,360 400,400 Q420,440 370,460 Q340,470 330,430
        "/>
      </path>
    </g>
  </g>
</svg>
